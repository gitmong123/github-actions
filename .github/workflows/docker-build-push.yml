name: Docker build and push

on:
  push:
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Code checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push to Docker Hub
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .github/workflows/Dockerfile  # Explicitly specify Dockerfile location
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USER }}/github-actions-app:${{ github.ref_name }}
            ${{ vars.DOCKERHUB_USER }}/github-actions-app:latest
            ${{ vars.DOCKERHUB_USER }}/github-actions-app:${{ github.sha }}